<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" font-family="system-ui, -apple-system, sans-serif">
<rect x="0" y="0" width="960" height="640" fill="#FFFCF0"/>
<text x="480" y="42" text-anchor="middle" font-size="21" font-weight="700" fill="#100F0F">Whether a giant component exists is decided by one slope</text>
<text x="480" y="68" text-anchor="middle" font-size="14" fill="#6F6E69">u = 1 always solves u = G₁(u). Since G₁(0) &gt; 0 the curve starts above the line — does it come back before u = 1?</text>
<text x="80" y="112" font-size="17" font-weight="700" fill="#100F0F">Below threshold</text>
<text x="80" y="136" font-size="15" fill="#6F6E69">G₁′(1) = 0.7 &lt; 1</text>
<path d="M 80 308 Q 220 266 360 168 L 80 448 Z" fill="#205EA6" opacity="0.11"/>
<g stroke="#DAD8CE" stroke-width="1">
<line x1="150" y1="168" x2="150" y2="448"/>
<line x1="80" y1="378" x2="360" y2="378"/>
<line x1="220" y1="168" x2="220" y2="448"/>
<line x1="80" y1="308" x2="360" y2="308"/>
<line x1="290" y1="168" x2="290" y2="448"/>
<line x1="80" y1="238" x2="360" y2="238"/>
<line x1="360" y1="168" x2="360" y2="448"/></g>
<line x1="80" y1="164" x2="80" y2="448" stroke="#100F0F" stroke-width="1.6"/>
<line x1="80" y1="448" x2="364" y2="448" stroke="#100F0F" stroke-width="1.6"/>
<line x1="80" y1="448" x2="360" y2="168" stroke="#6F6E69" stroke-width="2" stroke-dasharray="8 5"/>
<line x1="360" y1="168" x2="393.9" y2="134.1" stroke="#6F6E69" stroke-width="2" stroke-dasharray="8 5" opacity="0.8"/>
<line x1="319.0" y1="196.7" x2="399.3" y2="140.5" stroke="#100F0F" stroke-width="1.6"/>
<path d="M 80 308 Q 220 266 360 168" fill="none" stroke="#205EA6" stroke-width="3.2" stroke-linecap="round"/>
<circle cx="360" cy="168" r="5.5" fill="#100F0F" stroke="#FFFCF0" stroke-width="1.8"/>
<text x="351" y="160" text-anchor="end" font-size="14" fill="#100F0F">(1, 1)</text>
<text x="378" y="182" font-size="13" fill="#6F6E69">tangent at (1, 1)</text>
<text x="94" y="241" font-size="15" font-weight="600" fill="#205EA6">y = G₁(u)</text><text x="270" y="298" text-anchor="middle" font-size="14" fill="#6F6E69" transform="rotate(-45 270 298)">y = u</text><text x="206" y="295" text-anchor="middle" font-size="14" font-weight="600" fill="#205EA6" transform="rotate(-45 206 295)">G₁(u) &gt; u</text>
<g stroke="#100F0F" stroke-width="1.2">
<line x1="80" y1="448" x2="80" y2="453"/>
<line x1="220" y1="448" x2="220" y2="453"/>
<line x1="360" y1="448" x2="360" y2="453"/>
<line x1="75" y1="308" x2="80" y2="308"/><line x1="75" y1="168" x2="80" y2="168"/></g>
<g font-size="13" fill="#6F6E69">
<text x="80" y="470" text-anchor="middle">0</text>
<text x="220" y="470" text-anchor="middle">0.5</text>
<text x="360" y="470" text-anchor="middle">1</text>
<text x="70" y="313" text-anchor="end">0.5</text><text x="70" y="173" text-anchor="end">1</text></g>
<text x="220.0" y="496" text-anchor="middle" font-size="15" fill="#100F0F">u</text>
<text x="40" y="308" text-anchor="middle" font-size="15" fill="#100F0F" transform="rotate(-90 40 308)">y</text>
<text x="220.0" y="522" text-anchor="middle" font-size="15" font-weight="600" fill="#100F0F">Arrives shallower than 45°</text>
<text x="220.0" y="546" text-anchor="middle" font-size="14" fill="#100F0F">→ u = 1 is the only solution</text>
<text x="220.0" y="570" text-anchor="middle" font-size="14" fill="#6F6E69">→ no giant component,  S = 0</text>
<text x="540" y="112" font-size="17" font-weight="700" fill="#100F0F">Above threshold</text>
<text x="540" y="136" font-size="15" fill="#6F6E69">G₁′(1) = 1.6 &gt; 1</text>
<path d="M 540 420 Q 560 416 580 408 L 540 448 Z" fill="#205EA6" opacity="0.11"/>
<path d="M 580 408 Q 700 360 820 168 Z" fill="#AF3029" opacity="0.11"/>
<g stroke="#DAD8CE" stroke-width="1">
<line x1="610" y1="168" x2="610" y2="448"/>
<line x1="540" y1="378" x2="820" y2="378"/>
<line x1="680" y1="168" x2="680" y2="448"/>
<line x1="540" y1="308" x2="820" y2="308"/>
<line x1="750" y1="168" x2="750" y2="448"/>
<line x1="540" y1="238" x2="820" y2="238"/>
<line x1="820" y1="168" x2="820" y2="448"/></g>
<line x1="540" y1="164" x2="540" y2="448" stroke="#100F0F" stroke-width="1.6"/>
<line x1="540" y1="448" x2="824" y2="448" stroke="#100F0F" stroke-width="1.6"/>
<line x1="540" y1="448" x2="820" y2="168" stroke="#6F6E69" stroke-width="2" stroke-dasharray="8 5"/>
<line x1="820" y1="168" x2="853.9" y2="134.1" stroke="#6F6E69" stroke-width="2" stroke-dasharray="8 5" opacity="0.8"/>
<line x1="793.5" y1="210.4" x2="845.4" y2="127.3" stroke="#100F0F" stroke-width="1.6"/>
<path d="M 540 420 Q 560 416 580 408 Q 700 360 820 168" fill="none" stroke="#205EA6" stroke-width="3.2" stroke-linecap="round"/>
<line x1="580" y1="408" x2="580" y2="448" stroke="#AF3029" stroke-width="1.6" stroke-dasharray="2 3"/>
<circle cx="580" cy="408" r="5.5" fill="#AF3029" stroke="#FFFCF0" stroke-width="1.8"/>
<text x="580" y="470" text-anchor="middle" font-size="15" font-weight="700" fill="#AF3029">u*</text>
<circle cx="820" cy="168" r="5.5" fill="#100F0F" stroke="#FFFCF0" stroke-width="1.8"/>
<text x="811" y="160" text-anchor="end" font-size="14" fill="#100F0F">(1, 1)</text>
<text x="838" y="182" font-size="13" fill="#6F6E69">tangent at (1, 1)</text>
<text x="641" y="423" font-size="15" font-weight="600" fill="#205EA6">y = G₁(u)</text><text x="615" y="341" text-anchor="middle" font-size="14" fill="#6F6E69" transform="rotate(-45 615 341)">y = u</text><text x="714" y="297" text-anchor="middle" font-size="14" font-weight="600" fill="#AF3029" transform="rotate(-45 714 297)">G₁(u) &lt; u</text>
<g stroke="#100F0F" stroke-width="1.2">
<line x1="540" y1="448" x2="540" y2="453"/>
<line x1="680" y1="448" x2="680" y2="453"/>
<line x1="820" y1="448" x2="820" y2="453"/>
<line x1="535" y1="308" x2="540" y2="308"/><line x1="535" y1="168" x2="540" y2="168"/></g>
<g font-size="13" fill="#6F6E69">
<text x="540" y="470" text-anchor="middle">0</text>
<text x="680" y="470" text-anchor="middle">0.5</text>
<text x="820" y="470" text-anchor="middle">1</text>
<text x="530" y="313" text-anchor="end">0.5</text><text x="530" y="173" text-anchor="end">1</text></g>
<text x="680.0" y="496" text-anchor="middle" font-size="15" fill="#100F0F">u</text>
<text x="500" y="308" text-anchor="middle" font-size="15" fill="#100F0F" transform="rotate(-90 500 308)">y</text>
<text x="680.0" y="522" text-anchor="middle" font-size="15" font-weight="600" fill="#100F0F">Arrives steeper than 45°</text>
<text x="680.0" y="546" text-anchor="middle" font-size="14" fill="#100F0F">→ a second solution u* ≈ 0.14</text>
<text x="680.0" y="570" text-anchor="middle" font-size="14" fill="#6F6E69">→ giant component,  S = 1 − G₀(u*)</text>
<line x1="80" y1="592" x2="880" y2="592" stroke="#DAD8CE" stroke-width="1"/>
<text x="480" y="616" text-anchor="middle" font-size="14" fill="#6F6E69">G₁ is convex, so it meets the line at most twice — the slope at (1, 1) decides whether the second meeting exists.</text>
</svg>